{% extends 'base.html' %}

{% block content %}
    <nav class="breadcrumbs" aria-label="Хлебные крошки"><a href="{% url 'katalog' %}">Главная</a><span>/</span><span>Вход</span></nav>
    <header class="page-heading"><h1>Вход в аккаунт</h1><p>Введите почту или телефон и пароль</p></header>
    <section class="forma forma--tall">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Войти</button>
        </form>
        <p class="form-note">Нет аккаунта? <a href="{% url 'registraciya' %}">Зарегистрироваться</a></p>
    </section>
{% endblock %}
