{% extends 'base.html' %}

{% block content %}
    <h1>Инструменты на ремонт</h1>
    <section class="zakazy">
        {% for item in instrumenty %}
            <article>
                <h2>{{ item.model.nazvanie }}</h2>
                <p>Серийный номер: {{ item.seriinij_nomer }}</p>
                <form method="post" action="{% url 'remont_zavershit' item.id %}">
                    {% csrf_token %}
                    <button class="knopka">Отметить ремонт завершенным</button>
                </form>
            </article>
        {% empty %}
            <p>Инструментов на ремонте нет.</p>
        {% endfor %}
    </section>
{% endblock %}
